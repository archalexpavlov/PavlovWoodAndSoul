<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAVLOV — nowoczesne domki dla dzieci</title>
<meta name="description" content="Projektuję i buduję nowoczesne domki dla dzieci. Projekt, budowa, wyposażenie. Nowy Sącz i okolice do 150 km.">
<link rel="canonical" href="https://alexpavlov.pl/">

<meta property="og:type" content="website">
<meta property="og:title" content="PAVLOV — nowoczesne domki dla dzieci">
<meta property="og:description" content="Projekt, budowa, wyposażenie. Nowy Sącz i 150 km wokół.">
<meta property="og:url" content="https://alexpavlov.pl/">
<meta property="og:locale" content="pl_PL">

<style>
  :root{
    --bg:#F4F1ED;
    --ink:#2A2A2A;
    --muted:#6E6A65;
    --line:#DCD6CE;
    --wood:#A8703F;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1A1A1A;
      --ink:#EDE9E3;
      --muted:#9A948C;
      --line:#333029;
      --wood:#C98F5C;
    }
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:400 17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
  }

  main{width:100%;max-width:460px}

  .mark{
    font-size:clamp(34px,9vw,46px);
    font-weight:600;
    letter-spacing:.22em;
    margin:0 0 28px;
    text-indent:.22em;
  }

  .lede{
    font-size:clamp(19px,4.6vw,22px);
    line-height:1.45;
    margin:0 0 32px;
  }

  ul{
    list-style:none;
    margin:0 0 36px;
    padding:0;
    color:var(--muted);
    font-size:16px;
  }
  li{padding:9px 0;border-bottom:1px solid var(--line)}
  li:first-child{border-top:1px solid var(--line)}

  .contact{display:flex;flex-direction:column;gap:14px}
  a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--wood);padding-bottom:2px;width:fit-content}
  a:hover{color:var(--wood)}

  footer{margin-top:40px;color:var(--muted);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<main>
  <h1 class="mark">PAVLOV</h1>

  <p class="lede">Nowoczesne domki dla dzieci.<br>Projektuję i buduję.</p>

  <ul>
    <li>Projekt pod konkretną działkę</li>
    <li>Budowa i wyposażenie</li>
    <li>Nowy Sącz i 150 km wokół</li>
  </ul>

  <div class="contact">
    <a href="mailto:kontakt@alexpavlov.pl">kontakt@alexpavlov.pl</a>
    <a href="https://instagram.com/pavlov.pl" rel="noopener">instagram.com/pavlov.pl</a>
  </div>

  <footer>
    Gostwica 424, 33-386 Podegrodzie
  </footer>
</main>
</body>
</html>
